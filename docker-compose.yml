name: analytics

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One-shot: creates random secrets in a volume on the first start, then exits.
  secrets-init:
    image: postgres:18-alpine
    entrypoint: ["sh", "/init-secrets.sh"]
    network_mode: none
    restart: "no"
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - app_secrets:/run/app-secrets
      - ./scripts/init-secrets.sh:/init-secrets.sh:ro

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD_FILE: /run/app-secrets/postgres_password
    volumes:
      - db_data:/var/lib/postgresql
      - db_backups:/backups
      - app_secrets:/run/app-secrets:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      # -h forces TCP: the temporary server used during init listens on a socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 1.0
    # The API writes only to /tmp and runs as a non-root user on an unprivileged port.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      SECRETS_DIR: /run/app-secrets
      Jwt__Issuer: ${JWT_ISSUER:-project-monitoring}
      Jwt__Audience: ${JWT_AUDIENCE:-project-monitoring-clients}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-60}
      Admin__Email: ${ADMIN_EMAIL:-admin@example.com}
    volumes:
      - app_secrets:/run/app-secrets:ro
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Runs only when started by name, for scripts/rotate_logs.sh --simulate.
  log-simulator:
    image: postgres:18-alpine
    profiles: ["tools"]
    entrypoint: ["sh", "-c", "base64 /dev/urandom | head -c 41943040"]
    network_mode: none
    restart: "no"
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  # Publishes the API.
  frontend:
    name: analytics_frontend
  # Connects the API to the database. Internal, so the database has no route outside Docker.
  backend:
    name: analytics_backend
    internal: true

volumes:
  db_data:
  db_backups:
  app_secrets:
