# Rotates the logs written by scripts, such as cron output in logs/backup.log.
# Container logs are limited separately by the logging options in docker-compose.yml.
#
# Run through scripts/rotate_logs.sh, which uses the project root as the working directory.
# Paths must be quoted to be relative.
"logs/*.log" {
    daily
    # Rotates sooner when a file passes this size, so run it hourly to limit disk use.
    maxsize 10M
    rotate 7
    compress
    missingok
    notifempty
    # Keeps the file in place, so a script appending at that moment does not lose its handle.
    copytruncate
}
