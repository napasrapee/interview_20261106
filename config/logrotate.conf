# Rotates the logs written by scripts, such as cron output in logs/backup.log.
# Container logs are limited separately by the logging options in docker-compose.yml.
#
# Paths are relative, so run from the project root (see the README for the cron entry):
#   logrotate --state logs/.logrotate.state config/logrotate.conf
"logs/*.log" {
    daily
    rotate 7
    compress
    missingok
    notifempty
    # Keeps the file in place, so a script appending at that moment does not lose its handle.
    copytruncate
}
